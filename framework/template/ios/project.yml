# xcodegen project of the __Name__ app's GENERATED native app: the framework's Swift kit,
# elmgen's output, and a 20-line App. Build and run: `make ios` in its directory.
name: __Name__Gen
options:
  bundleIdPrefix: art.fralex
  deploymentTarget: { iOS: "17.0" }
  xcodeVersion: "27.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug: { SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG, ONLY_ACTIVE_ARCH: YES }
targets:
  __Name__Gen:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - { path: App }
      - { path: ../__FW__/swift, name: ElmLeanKit }   # framework: Html, JSON, Session + the SwiftUI element kit
      - { path: ../generated, name: Generated }               # elmgen output: types, update, view, __Name__Screen
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: __Name__
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.fralex.elmlean.__name__
        PRODUCT_NAME: __Name__Gen
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        # ad-hoc signed in the simulator: an unsigned app has no Keychain entitlement (errSecMissingEntitlement)
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
    scheme: { gatherCoverageData: false }
