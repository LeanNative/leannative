# The ElmLean framework. An app is its own Lake package that requires this one:
#
#   [[require]]
#   name = "elmlean"
#   path = "../../framework/lean"      # or a git source
#
# and then runs `lake exe elmgen …` from its own directory (see the README).
name = "elmlean"
defaultTargets = ["ElmLean", "ElmGen", "elmgen"]

[[lean_lib]]
name = "ElmLean"

[[lean_lib]]
name = "ElmGen"

[[lean_exe]]
name = "elmgen"
root = "ElmGen.Main"
# elmgen pretty-prints Lean terms in its error messages; the delaborator resolves imported formatter
# entries through the interpreter, which needs the executable's symbols exported.
supportInterpreter = true
