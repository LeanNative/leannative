# The ElmLean framework. An app is its own Lake package that requires this one:
#
#   [[require]]
#   name = "elmlean"
#   path = "../../framework/lean"      # or a git source
#
# and builds into an iOS app with framework/native (see framework/native/README.md).
name = "elmlean"
defaultTargets = ["ElmLean", "ElmShell", "elmshell"]

[[lean_lib]]
name = "ElmLean"

# The native shell: `lake exe elmshell <dir>` prints its Objective-C (framework/native/README.md).
[[lean_lib]]
name = "ElmShell"

[[lean_exe]]
name = "elmshell"
root = "ElmShell.Main"

# BackgroundRun's lifecycle tests (`make check` runs them; not a default target, apps never build it).
[[lean_exe]]
name = "background-run-test"
root = "ElmLeanTest.BackgroundRun"
