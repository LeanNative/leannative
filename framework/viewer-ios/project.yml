name: ElmLeanApp
options:
  bundleIdPrefix: art.fralex
  deploymentTarget: { iOS: "17.0" }
  xcodeVersion: "27.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"                        # preset default is 5.0
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated  # keep Node/Decodable nonisolated; ElmClient is @MainActor explicitly
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug: { SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG, ONLY_ACTIVE_ARCH: YES }
targets:
  ElmLeanApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [ { path: ElmLeanApp } ]
    info:
      path: ElmLeanApp/Info.plist
      properties:
        CFBundleDisplayName: ElmLean
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}                       # system launch screen → no letterboxing
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity: { NSAllowsLocalNetworking: true }
        NSLocalNetworkUsageDescription: "ElmLean connects to the elmlean bridge running on your Mac."
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.fralex.elmlean
        PRODUCT_NAME: ElmLeanApp
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": ""
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
        "CODE_SIGNING_ALLOWED[sdk=iphonesimulator*]": "NO"
    scheme: { testTargets: [ElmLeanAppTests], gatherCoverageData: false }
  ElmLeanAppTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [ { path: ElmLeanAppTests } ]
    dependencies: [ { target: ElmLeanApp } ]
    settings: { base: { PRODUCT_BUNDLE_IDENTIFIER: art.fralex.elmlean.tests, GENERATE_INFOPLIST_FILE: YES } }
