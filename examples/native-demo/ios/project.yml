# xcodegen project of a native-mode ElmLean app, with no Swift at all. The framework's generic shell
# (Objective-C printed by `lake exe elmshell` into build/native-shell, and framework/native/c) plus the C
# that Lean generated for the app (build/lean-c); both made by framework/native/scripts/ios_lean_sources.sh.
# Linked with Lean's runtime retargeted to iOS (build/lib).
name: NativeDemo
options:
  bundleIdPrefix: art.fralex
  deploymentTarget: { iOS: "17.0" }
  xcodeVersion: "27.1"
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    CLANG_ENABLE_OBJC_ARC: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  NativeDemo:
    type: application
    platform: iOS
    sources:
      - { path: build/native-shell, name: ElmLeanShell }
      - { path: ../../../framework/native/c, name: ElmLeanShim }
      - { path: build/lean-c, name: LeanC, compilerFlags: [-w] }
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: Native Demo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        # the shell's scene delegate (ElmLeanShell.h)
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: ELSceneDelegate
        NSFaceIDUsageDescription: "Shows that a Lean app can ask for Face ID."
        # the shell registers a launch handler for each of these at launch (the Probes tab schedules them)
        UIBackgroundModes: [fetch, processing]
        BGTaskSchedulerPermittedIdentifiers:
          - art.fralex.elmlean.nativedemo.refresh
          - art.fralex.elmlean.nativedemo.processing
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.fralex.elmlean.nativedemo
        PRODUCT_NAME: NativeDemo
        GENERATE_INFOPLIST_FILE: NO
        HEADER_SEARCH_PATHS: ["/Users/posix4e/.elan/toolchains/leanprover--lean4---v4.35.0/include", "$(PROJECT_DIR)/../../../framework/native/c"]
        LIBRARY_SEARCH_PATHS: ["$(PROJECT_DIR)/build/lib"]
        OTHER_LDFLAGS: [-lLean, -lStd, -lInit, -lleanrt, -luv, -lgmp, -lc++]
        # Lean's generated C at -O3 in every configuration, as Lean builds it
        GCC_OPTIMIZATION_LEVEL: "3"
        DEAD_CODE_STRIPPING: YES
        # ad-hoc signed in the simulator: an unsigned app has no Keychain entitlement (errSecMissingEntitlement)
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
