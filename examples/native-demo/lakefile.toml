# A native-mode LeanNative app: full Lean, compiled to C and run inside the iOS app (see framework/native).
name = "nativedemo"
defaultTargets = ["NativeDemo"]

[[require]]
name = "leannative"
path = "../../framework/lean"

[[lean_lib]]
name = "NativeDemo"

# The Xcode project's spec, from NativeDemo/Project.lean (framework/native/ci/build-ios runs it)
[[lean_exe]]
name = "ios-project"
root = "NativeDemo.Project"

# The UI journeys (NativeDemo/Journeys.lean), run on the Mac by framework/native/ci/ui-tests as UI_JOURNEY
[[lean_exe]]
name = "journeys"
root = "NativeDemo.Journeys"
