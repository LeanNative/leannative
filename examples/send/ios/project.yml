# xcodegen project of the Send example's GENERATED native app: the framework's Swift kit, elmgen's
# output, and a hand-written host that runs the app's commands against Winnow's WalletCore.
# WINNOW (set by the Makefile, default ~/src/winnow-claude) is the Winnow checkout to build against.
name: SendGen
options:
  bundleIdPrefix: art.fralex
  deploymentTarget: { iOS: "17.0" }
  xcodeVersion: "27.1"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug: { SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG, ONLY_ACTIVE_ARCH: YES }
packages:
  Winnow:
    path: ${WINNOW}
targets:
  SendGen:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - { path: App }
      - { path: ../../../framework/swift, name: ElmLeanKit }   # framework: Html, JSON, sessions + the SwiftUI element kit
      - { path: ../generated, name: Generated }               # elmgen output: types, update, view, cmds, codecs, SendScreen
    dependencies:
      - package: Winnow
        product: WalletCore
      - package: Winnow
        product: TestSupport                                  # the demo wallet: Winnow's funded test-mnemonic signet wallet
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Send
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: "Approve the payment you reviewed."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: art.fralex.elmlean.send
        PRODUCT_NAME: SendGen
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        # ad-hoc signed in the simulator: an unsigned app has no Keychain entitlement (errSecMissingEntitlement)
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        "CODE_SIGNING_REQUIRED[sdk=iphonesimulator*]": "NO"
    scheme: { gatherCoverageData: false }
