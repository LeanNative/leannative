name: check
# This repository's own checks on GitHub-hosted macOS (free for a public repository): `make check` (the
# framework's build, proof and axiom gate, protocol harness), then native-demo built for the iOS simulator
# and for Mac Catalyst, each checked for Swift; native-demo's UI tests and journeys (`ui`, `ui-catalyst`); and the
# examples simple and bluetooth-auth, one job each (`examples`). Apps use ios-app.yml instead.
# Five macOS jobs at once, no more: GitHub runs at most five macOS jobs at a time for the whole organization, so
# a run that needs more queues against itself. A new example goes into a job that is already here.
# The repository variable MACOS_RUNNER, when set, is the runner label check, ui and examples run on instead (a
# self-hosted Mac, while GitHub's are backed up; unset it before that Mac goes away, or its jobs wait for it).
# A fork's pull request always runs on GitHub's: a self-hosted runner never runs code from outside the repository.
# ui-catalyst stays on GitHub's: it tests under the runner's own logged-in session.
# Each job builds on the latest Lean build main cached under its name and saves its own on main only: a pull
# request restores main's and adds no entry (the cache holds 10 GB a repository, an entry is the whole build).
# The toolchain is not cached: it is 700 MB of an entry zstd'd, and elan installs it in half a minute.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: check-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  APP_DIR: examples/native-demo
  APP_ROOT: NativeDemo
  SCHEME: NativeDemo
jobs:
  check:
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'macos-26') || vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          xcodebuild -version
          sw_vers
          command -v zstd >/dev/null || brew install zstd
      - name: Restore the Lean builds (main's latest)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            framework/lean/.lake
            examples/native-demo/.lake
          key: check-${{ hashFiles('framework/lean/lean-toolchain', 'framework/lean/lake-manifest.json', 'examples/native-demo/lake-manifest.json') }}-${{ hashFiles('framework/lean/**/*.lean', 'examples/native-demo/**/*.lean') }}
          restore-keys: check-${{ hashFiles('framework/lean/lean-toolchain', 'framework/lean/lake-manifest.json', 'examples/native-demo/lake-manifest.json') }}-
      - name: elan and the Lean toolchain
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh \
              | sh -s -- -y --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # an elan that already has the toolchain refuses to install it again (4.2.3 exits 1), and a
          # self-hosted runner keeps its ~/.elan between jobs: install only what is missing, as ios-app.yml does
          t=$(cat framework/lean/lean-toolchain)
          have=$("$HOME/.elan/bin/elan" toolchain list)
          awk '{print $1}' <<< "$have" | grep -qxF "$t" || "$HOME/.elan/bin/elan" toolchain install "$t"
      - name: make check
        run: make check
      - name: native-demo for the iOS simulator
        run: |
          set -euo pipefail
          export DERIVED_DATA="$RUNNER_TEMP/dd-iossim" BUILD_LOG="$RUNNER_TEMP/Debug-iossim.log"
          framework/native/ci/build-ios Debug iossim
          framework/native/ci/check-no-swift "$BUILD_LOG" "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/$SCHEME.app"
      - name: native-demo for Mac Catalyst
        run: |
          set -euo pipefail
          framework/native/scripts/fetch_lean_x86_64.sh "$RUNNER_TEMP/lean-x86_64"
          export LEAN_X86_64_PREFIX="$RUNNER_TEMP/lean-x86_64/lean-$(sed 's/.*:v//' framework/lean/lean-toolchain)-darwin"
          export DERIVED_DATA="$RUNNER_TEMP/dd-catalyst" BUILD_LOG="$RUNNER_TEMP/Debug-maccatalyst.log"
          framework/native/ci/build-ios Debug maccatalyst
          framework/native/ci/check-no-swift "$BUILD_LOG" "$DERIVED_DATA/Build/Products/Debug-maccatalyst/$SCHEME.app"
      - name: Save the Lean builds (on main only)
        if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            framework/lean/.lake
            examples/native-demo/.lake
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: The UI tests build for Mac Catalyst; no app links XCTest
        run: |
          set -euo pipefail
          # the test kit's Catalyst branches compile (the ui-catalyst job runs them)
          xcodebuild -project examples/native-demo/ios/NativeDemo.xcodeproj -scheme "$SCHEME" -configuration Debug \
            -destination 'generic/platform=macOS,variant=Mac Catalyst' -derivedDataPath "$RUNNER_TEMP/dd-catalyst" \
            build-for-testing > "$RUNNER_TEMP/Debug-maccatalyst-tests.log" 2>&1 || { tail -40 "$RUNNER_TEMP/Debug-maccatalyst-tests.log"; exit 1; }
          for app in "$RUNNER_TEMP/dd-iossim/Build/Products/Debug-iphonesimulator/$SCHEME.app/$SCHEME" \
                     "$RUNNER_TEMP/dd-catalyst/Build/Products/Debug-maccatalyst/$SCHEME.app/Contents/MacOS/$SCHEME"; do
            if otool -L "$app" | grep -i xctest; then echo "::error::$app links XCTest"; exit 1; fi
          done
          echo "no app links XCTest"
      - name: Preserve the build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: check-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/*.log
            examples/native-demo/ios/build/*.log
          if-no-files-found: warn
          retention-days: 14
  # native-demo's UI tests (the framework's XCTest kit against real controls) on a throwaway simulator,
  # then their evidence (framework/native/ci/export-evidence), both kept as artifacts
  ui:
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'macos-26') || vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
      - name: Restore the Lean builds (main's latest)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            framework/lean/.lake
            examples/native-demo/.lake
          key: ui-${{ hashFiles('framework/lean/lean-toolchain', 'framework/lean/lake-manifest.json', 'examples/native-demo/lake-manifest.json') }}-${{ hashFiles('framework/lean/**/*.lean', 'examples/native-demo/**/*.lean') }}
          restore-keys: ui-${{ hashFiles('framework/lean/lean-toolchain', 'framework/lean/lake-manifest.json', 'examples/native-demo/lake-manifest.json') }}-
      - name: elan and the Lean toolchain
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh \
              | sh -s -- -y --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # an elan that already has the toolchain refuses to install it again (4.2.3 exits 1), and a
          # self-hosted runner keeps its ~/.elan between jobs: install only what is missing, as ios-app.yml does
          t=$(cat framework/lean/lean-toolchain)
          have=$("$HOME/.elan/bin/elan" toolchain list)
          awk '{print $1}' <<< "$have" | grep -qxF "$t" || "$HOME/.elan/bin/elan" toolchain install "$t"
      - name: native-demo UI tests
        run: |
          UI_OUT="$RUNNER_TEMP/ui" UI_BEFORE="$PWD/examples/native-demo/ios/ui-before" DERIVED_DATA="$RUNNER_TEMP/dd" \
            framework/native/ci/ui-tests
      - name: native-demo journeys (Lean on the host, the kit's driver in the app)
        run: |
          set -euo pipefail
          (cd examples/native-demo && lake build journeys)
          UI_OUT="$RUNNER_TEMP/journeys" UI_NAME=journeys DERIVED_DATA="$RUNNER_TEMP/dd" \
            UI_JOURNEY="$PWD/examples/native-demo/.lake/build/bin/journeys" framework/native/ci/ui-tests
          test -s "$RUNNER_TEMP/journeys/screenshots/journey-widgets.png"
      - name: Save the Lean builds (on main only)
        if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            framework/lean/.lake
            examples/native-demo/.lake
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: native-demo journeys against the app itself, headless (no simulator)
        run: |
          set -euo pipefail
          UI_OUT="$RUNNER_TEMP/journeys-wire" framework/native/ci/wire-journeys journeys
          test -s "$RUNNER_TEMP/journeys-wire/screenshots/journey-widgets.wire.json"
      - name: Their evidence
        if: always()
        run: |
          python3 -I framework/native/ci/export-evidence "$RUNNER_TEMP/ui" "$RUNNER_TEMP/evidence" --require-passed
          python3 -I framework/native/ci/export-evidence "$RUNNER_TEMP/journeys" "$RUNNER_TEMP/evidence-journeys" --require-passed
      - name: The journeys' media (journey-media, as ios-app.yml's journey-media input makes it)
        run: |
          set -euo pipefail
          python3 -I framework/native/ci/journey-media "$RUNNER_TEMP/journeys" "$RUNNER_TEMP/journey-media" \
            --journeys examples/native-demo/NativeDemo/Journeys.lean --test-prefix test --field app=native-demo
          test -s "$RUNNER_TEMP/journey-media/screenshots/journey-widgets.png"
      - name: Preserve the run and its evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ui/
            ${{ runner.temp }}/evidence/
            ${{ runner.temp }}/journeys/
            ${{ runner.temp }}/evidence-journeys/
            ${{ runner.temp }}/journeys-wire/
            ${{ runner.temp }}/journey-media/
            !${{ runner.temp }}/ui/*.xcresult/**/private/
            !${{ runner.temp }}/journeys/*.xcresult/**/private/
          if-no-files-found: warn
          retention-days: 14
  # the same UI tests under Mac Catalyst, on the runner's own logged-in session: the kit's click, scroll wheel
  # and Command-A paths, and the selftest through the Mac shell; recorded as a Mac Catalyst run (run.json,
  # device.json), which export-evidence checks against the result bundle
  ui-catalyst:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools
        run: |
          xcodebuild -version
          sw_vers
          sysctl -n hw.model
          command -v zstd >/dev/null || brew install zstd
      - name: Restore the Lean builds (main's latest)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            framework/lean/.lake
            examples/native-demo/.lake
          key: ui-catalyst-${{ hashFiles('framework/lean/lean-toolchain', 'framework/lean/lake-manifest.json', 'examples/native-demo/lake-manifest.json') }}-${{ hashFiles('framework/lean/**/*.lean', 'examples/native-demo/**/*.lean') }}
          restore-keys: ui-catalyst-${{ hashFiles('framework/lean/lean-toolchain', 'framework/lean/lake-manifest.json', 'examples/native-demo/lake-manifest.json') }}-
      - name: elan and the Lean toolchain
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh \
              | sh -s -- -y --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # an elan that already has the toolchain refuses to install it again (4.2.3 exits 1), and a
          # self-hosted runner keeps its ~/.elan between jobs: install only what is missing, as ios-app.yml does
          t=$(cat framework/lean/lean-toolchain)
          have=$("$HOME/.elan/bin/elan" toolchain list)
          awk '{print $1}' <<< "$have" | grep -qxF "$t" || "$HOME/.elan/bin/elan" toolchain install "$t"
      - name: native-demo UI tests under Mac Catalyst
        run: |
          set -euo pipefail
          framework/native/scripts/fetch_lean_x86_64.sh "$RUNNER_TEMP/lean-x86_64"
          export LEAN_X86_64_PREFIX="$RUNNER_TEMP/lean-x86_64/lean-$(sed 's/.*:v//' framework/lean/lean-toolchain)-darwin"
          UI_PLATFORM=maccatalyst UI_OUT="$RUNNER_TEMP/ui" UI_BEFORE="$PWD/examples/native-demo/ios/ui-before" \
            DERIVED_DATA="$RUNNER_TEMP/dd" framework/native/ci/ui-tests
      - name: Save the Lean builds (on main only)
        if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            framework/lean/.lake
            examples/native-demo/.lake
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Their evidence
        if: always()
        run: python3 -I framework/native/ci/export-evidence "$RUNNER_TEMP/ui" "$RUNNER_TEMP/evidence" --require-passed
      - name: Preserve the run and its evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-catalyst-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ui/
            ${{ runner.temp }}/evidence/
            !${{ runner.temp }}/ui/*.xcresult/**/private/
          if-no-files-found: warn
          retention-days: 14

  # simple and bluetooth-auth, one job each and everything on its runner: their journeys headless (no simulator),
  # then the Debug simulator build (checked for Swift, and for the frameworks the manifest's `uses` decides:
  # simple links neither CoreBluetooth nor LocalAuthentication, bluetooth-auth both), then the journeys on a
  # throwaway simulator with a recording, made into journey-media-<example> (leannative.com shows it).
  examples:
    name: "example: ${{ matrix.example }}"
    runs-on: ${{ (github.event.pull_request.head.repo.fork && 'macos-26') || vars.MACOS_RUNNER || 'macos-26' }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: simple
            root: Simple
            frameworks: --lacks CoreBluetooth --lacks LocalAuthentication
          - example: bluetooth-auth
            root: BluetoothAuth
            frameworks: --links CoreBluetooth --links LocalAuthentication
    env:
      APP_DIR: examples/${{ matrix.example }}
      APP_ROOT: ${{ matrix.root }}
      SCHEME: ${{ matrix.root }}
      EXAMPLE: ${{ matrix.example }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the recording's browser copy needs ffmpeg: a minute of downloads, done by the time the media step waits
      - name: ffmpeg, installing while the app builds
        run: |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then echo 0 > "$RUNNER_TEMP/ffmpeg.done"; exit 0; fi
          # shellcheck disable=SC2016 # the inner bash expands them
          nohup bash -c 'HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg > "$RUNNER_TEMP/ffmpeg.log" 2>&1; echo $? > "$RUNNER_TEMP/ffmpeg.done"' \
            </dev/null >/dev/null 2>&1 &
      - name: Tools
        run: |
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios || true
      - name: Restore the Lean builds (main's latest)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            framework/lean/.lake
            ${{ env.APP_DIR }}/.lake
          key: example-${{ matrix.example }}-${{ hashFiles('framework/lean/lean-toolchain', 'framework/lean/lake-manifest.json', format('{0}/lake-manifest.json', env.APP_DIR)) }}-${{ hashFiles('framework/lean/**/*.lean', format('{0}/**/*.lean', env.APP_DIR)) }}
          restore-keys: example-${{ matrix.example }}-${{ hashFiles('framework/lean/lean-toolchain', 'framework/lean/lake-manifest.json', format('{0}/lake-manifest.json', env.APP_DIR)) }}-
      - name: elan and the Lean toolchain
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh \
              | sh -s -- -y --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # an elan that already has the toolchain refuses to install it again (4.2.3 exits 1), and a
          # self-hosted runner keeps its ~/.elan between jobs: install only what is missing, as ios-app.yml does
          t=$(cat framework/lean/lean-toolchain)
          have=$("$HOME/.elan/bin/elan" toolchain list)
          awk '{print $1}' <<< "$have" | grep -qxF "$t" || "$HOME/.elan/bin/elan" toolchain install "$t"
      - name: The journeys against the app itself, headless (no simulator)
        run: |
          set -euo pipefail
          (cd "$APP_DIR" && lake build journeys)
          UI_OUT="$RUNNER_TEMP/journeys-wire" framework/native/ci/wire-journeys journeys
      - name: Save the Lean builds (on main only)
        if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            framework/lean/.lake
            ${{ env.APP_DIR }}/.lake
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: The simulator build, Debug, and the frameworks it links
        env:
          FRAMEWORKS: ${{ matrix.frameworks }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/$SCHEME.app"
          DERIVED_DATA="$RUNNER_TEMP/dd" BUILD_LOG="$RUNNER_TEMP/Debug-iossim.log" framework/native/ci/build-ios Debug iossim
          framework/native/ci/check-no-swift "$RUNNER_TEMP/Debug-iossim.log" "$app"
          # shellcheck disable=SC2086 # FRAMEWORKS are words
          framework/native/ci/check-frameworks $FRAMEWORKS "$app"
      - name: The journeys on a simulator (Lean on the host, the kit's driver in the app)
        run: |
          set -euo pipefail
          UI_OUT="$RUNNER_TEMP/journeys" UI_NAME=journey UI_PREPARED=1 DERIVED_DATA="$RUNNER_TEMP/dd" \
            UI_JOURNEY="$PWD/$APP_DIR/.lake/build/bin/journeys" framework/native/ci/ui-tests
      - name: Their evidence and media
        run: |
          set -euo pipefail
          python3 -I framework/native/ci/export-evidence "$RUNNER_TEMP/journeys" "$RUNNER_TEMP/evidence" --require-passed
          for ((i = 0; i < 1200; i++)); do [ -f "$RUNNER_TEMP/ffmpeg.done" ] && break; sleep 0.5; done
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            cat "$RUNNER_TEMP/ffmpeg.log" 2>/dev/null || true
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg >/dev/null
          fi
          python3 -I framework/native/ci/journey-media "$RUNNER_TEMP/journeys" "$RUNNER_TEMP/journey-media" \
            --video "videos/$EXAMPLE.mp4" --journeys "$APP_DIR/$APP_ROOT/Journeys.lean" --test-prefix test --field "app=$EXAMPLE"
      - name: Publish the media (leannative.com takes them from main's runs)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: journey-media-${{ matrix.example }}
          path: ${{ runner.temp }}/journey-media/
          if-no-files-found: error
          retention-days: 90
      - name: Preserve the run and its evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: example-${{ matrix.example }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/journeys-wire/
            ${{ runner.temp }}/journeys/
            ${{ runner.temp }}/evidence/
            ${{ runner.temp }}/*.log
            !${{ runner.temp }}/journeys/*.xcresult/**/private/
          if-no-files-found: warn
          retention-days: 14
