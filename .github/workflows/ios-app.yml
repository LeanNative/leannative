name: LeanNative iOS app
# Builds and tests a LeanNative app (README.md, "Continuous integration for an app"). `build` makes every Lean
# target once and saves it in the Actions cache; `tests`, `extra` and `app` restore that build read-only and
# run in parallel; they fail if the build is not in the cache rather than build again. The scripts it runs are
# LeanNative's own, from the app's resolved LeanNative package
# (<app-dir>/.lake/packages/leannative/framework/native/ci), so they are the commit the app pins; `leannative` must
# name that commit, and the build fails if the app's lake-manifest.json pins another.
#
#   uses: LeanNative/leannative/.github/workflows/ios-app.yml@<commit>
#   with: { leannative: <commit>, lean-packages: …, app-dir: …, app-root: …, scheme: …, … }
#
# Commands given as inputs run with bash in the repository root, the app's Lean on the PATH, CI_RESULTS set
# to the job's evidence directory and LEANNATIVE_CI to the scripts' directory (also as ELMLEAN_CI, deprecated, until
# v0.3.0).
#
# A self-hosted Mac (`self-hosted`: its labels) takes every job when it is online; `runs-on` takes them for pull
# requests from forks, when the caller passes `runner: hosted`, and, given `RUNNER_STATUS_TOKEN`, when no runner
# with those labels is online. On the self-hosted Mac the build moves between jobs as an APFS copy under
# ~/Library/Caches/leannative-ci (LEANNATIVE_CI_CACHE), not through the Actions cache, and its own ~/.elan is used.
on:
  workflow_call:
    inputs:
      leannative:
        description: The LeanNative commit this workflow is called at; must equal the app's lake-manifest.json pin
        type: string
        required: false
      elmlean:
        description: Deprecated name of `leannative` (until v0.3.0); give one of the two
        type: string
        required: false
      runs-on:
        description: The macOS runner label for every job (with `self-hosted`, the fallback)
        type: string
        default: macos-26
      self-hosted:
        description: 'A self-hosted Mac''s labels as a JSON array (`["self-hosted", "my-mac"]`); empty: always `runs-on`'
        type: string
        default: ''
      runner:
        description: '`hosted` sends the run to `runs-on` even when `self-hosted` is given (a repository variable, say)'
        type: string
        default: ''
      timeout-minutes:
        description: Each job's limit
        type: number
        default: 60
      lean-packages:
        description: The app's Lake packages, space-separated, in build order; their .lake directories are cached
        type: string
        required: true
      build-targets:
        description: "Lines `<package> <targets…>`: more Lake targets to build (the test executables)"
        type: string
        default: ''
      app-dir:
        description: The Lake package of the app (it requires leannative)
        type: string
        required: true
      app-root:
        description: The root module that registers the app
        type: string
        required: true
      scheme:
        description: The Xcode scheme; the app is <scheme>.app
        type: string
        required: true
      ios-dir:
        description: The app's ios directory, where its project is generated (default <app-dir>/ios)
        type: string
        default: ''
      prepare:
        description: A command run in `build` after the Lean build (data the app bundles, say)
        type: string
        default: ''
      carry:
        description: Paths the `prepare` command makes that the other jobs need, one per line
        type: string
        default: ''
      tests:
        description: "Lines `<directory> <command>`: each runs in `tests`, streamed; every line runs, and any failure fails the job"
        type: string
        default: ''
      extra:
        description: A command for a job of its own, beside `tests` and `app`
        type: string
        default: ''
      release-check:
        description: A command run as `<command> <Release .app> <Debug .app>` on the simulator builds
        type: string
        default: ''
      ui-tests:
        description: Run the scheme's UI tests on a throwaway simulator
        type: boolean
        default: true
      ui-name:
        description: The UI tests' evidence directory and the name of their result bundle and recording
        type: string
        default: ui-tests
      ui-device-type:
        description: The iPhone model the UI tests run on (the runner's newest iOS runtime must have it)
        type: string
        default: iPhone 17 Pro
      ui-args:
        description: More `xcodebuild test` arguments
        type: string
        default: ''
      ui-before:
        description: The UI tests' UI_BEFORE hook (framework/native/ci/ui-tests)
        type: string
        default: ''
      ui-after:
        description: The UI tests' UI_AFTER hook
        type: string
        default: ''
      after-ui:
        description: A command run once the UI tests have passed (media from their evidence, say)
        type: string
        default: ''
      publish-name:
        description: An artifact uploaded from `app` when everything passed
        type: string
        default: ''
      publish-path:
        description: Its path
        type: string
        default: ''
      publish-retention-days:
        type: number
        default: 90
    secrets:
      RUNNER_STATUS_TOKEN:
        description: Reads the repository's runners (Administration, read-only), so an offline self-hosted Mac falls back
        required: false
permissions:
  contents: read
env:
  LEAN_PACKAGES: ${{ inputs.lean-packages }}
  BUILD_TARGETS: ${{ inputs.build-targets }}
  APP_DIR: ${{ inputs.app-dir }}
  APP_ROOT: ${{ inputs.app-root }}
  SCHEME: ${{ inputs.scheme }}
  IOS_DIR: ${{ inputs.ios-dir }}
  LEANNATIVE_CI: ${{ github.workspace }}/${{ inputs.app-dir }}/.lake/packages/leannative/framework/native/ci
  ELMLEAN_CI: ${{ github.workspace }}/${{ inputs.app-dir }}/.lake/packages/leannative/framework/native/ci
jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runs-on: ${{ steps.pick.outputs.runs-on }}
      local: ${{ steps.pick.outputs.local }}
    steps:
      - name: The self-hosted Mac or runs-on
        id: pick
        env:
          SELF_HOSTED: ${{ inputs.self-hosted }}
          RUNNER: ${{ inputs.runner }}
          RUNS_ON: ${{ inputs.runs-on }}
          FORK: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: |
          set -euo pipefail
          hosted() {
            echo "runs-on ($1): $RUNS_ON"
            { echo "runs-on=$(jq -cn --arg l "$RUNS_ON" '$l')"; echo local=false; } >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ -n "$SELF_HOSTED" ] || hosted "no self-hosted Mac given"
          [ "$RUNNER" != hosted ] || hosted "runner: hosted"
          # a fork's code never runs on the self-hosted Mac
          [ "$FORK" != true ] || hosted "a pull request from a fork"
          if [ -n "$STATUS_TOKEN" ]; then
            online=$(curl -fsSL -H "Authorization: Bearer $STATUS_TOKEN" -H "Accept: application/vnd.github+json" \
                "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runners?per_page=100" \
              | jq --argjson want "$SELF_HOSTED" \
                  '[.runners[] | select(.status == "online") | [.labels[].name] as $have | select(all($want[]; . as $w | $have | index($w)))] | length') \
              || { echo "::warning::could not read the repository's runners"; online=0; }
            [ "$online" -gt 0 ] || hosted "no runner labelled $SELF_HOSTED is online"
          fi
          echo "self-hosted: $SELF_HOSTED"
          { echo "runs-on=$(jq -c . <<< "$SELF_HOSTED")"; echo local=true; } >> "$GITHUB_OUTPUT"

  build:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      key: ${{ steps.key.outputs.key }}
      paths: ${{ steps.key.outputs.paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: The app pins this LeanNative
        env:
          WANT: ${{ inputs.leannative || inputs.elmlean }}
        run: |
          [ -n "$WANT" ] || { echo "::error::the workflow needs leannative: <commit>"; exit 1; }
          found=$(/usr/bin/python3 - "$APP_DIR/lake-manifest.json" <<'PY'
          import json, sys
          print(" ".join(p.get("rev", "") for p in json.load(open(sys.argv[1]))["packages"] if p.get("name") == "leannative"))
          PY
          )
          echo "lake-manifest.json: leannative $found; workflow: leannative $WANT"
          [ "$found" = "$WANT" ] || { echo "::error::$APP_DIR/lake-manifest.json pins LeanNative at '$found', but the workflow is called with leannative: $WANT"; exit 1; }
      - name: The cache key
        id: key
        env:
          RUNS_ON: ${{ needs.runner.outputs.local == 'true' && 'self-hosted' || inputs.runs-on }}
        run: |
          set -euo pipefail
          paths="$HOME/.elan"
          deps=()
          specs=()
          for p in $LEAN_PACKAGES; do
            paths+=$'\n'"$p/.lake"
            deps+=("$p/lean-toolchain" "$p/lake-manifest.json")
            specs+=("$p/*.lean")
          done
          deps_hash=$(cat "${deps[@]}" 2>/dev/null | shasum -a 256 | cut -c1-20)
          src_hash=$(git ls-files -z -- "${specs[@]}" | xargs -0 shasum -a 256 | shasum -a 256 | cut -c1-20)
          {
            echo "key=leannative-$RUNS_ON-$deps_hash-$src_hash"
            echo "prefix=leannative-$RUNS_ON-$deps_hash-"
            echo 'paths<<PATHS'; echo "$paths"; echo PATHS
          } >> "$GITHUB_OUTPUT"
      - name: Restore the Lean toolchain and builds
        if: needs.runner.outputs.local != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.key.outputs.paths }}
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      - name: Restore the Lean builds (this Mac)
        if: needs.runner.outputs.local == 'true'
        env:
          KEY: ${{ steps.key.outputs.key }}
          PREFIX: ${{ steps.key.outputs.prefix }}
        run: &restore-local |
          set -euo pipefail
          root="${LEANNATIVE_CI_CACHE:-$HOME/Library/Caches/leannative-ci}/$GITHUB_REPOSITORY"
          src="$root/$KEY"
          # the build job may start from an older build of the same dependencies; the others need this one
          # shellcheck disable=SC2012 # the names are cache keys
          if [ ! -d "$src" ] && [ -n "${PREFIX:-}" ]; then src=$(ls -td "$root/$PREFIX"* 2>/dev/null | head -1 || true); fi
          if [ -z "$src" ] || [ ! -d "$src" ]; then
            [ -z "${PREFIX:-}" ] || { echo "no build kept for $PREFIX: building from scratch"; exit 0; }
            echo "::error::no build kept for $KEY on this Mac"; exit 1
          fi
          echo "restoring $src"
          for p in $LEAN_PACKAGES; do
            [ -d "$src/$p/.lake" ] || continue
            rm -rf "$p/.lake"; cp -cRp "$src/$p/.lake" "$p/.lake"
          done
      - name: elan and the Lean toolchain
        run: &elan |
          set -euo pipefail
          if ! command -v elan >/dev/null && [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh \
              | sh -s -- -y --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # a newer elan (a self-hosted Mac's own) refuses to install a toolchain it already has
          for p in $LEAN_PACKAGES; do
            t=$(cat "$p/lean-toolchain")
            have=$("$HOME/.elan/bin/elan" toolchain list)
            awk '{print $1}' <<< "$have" | grep -qxF "$t" || "$HOME/.elan/bin/elan" toolchain install "$t"
          done
          echo "CI_RESULTS=$RUNNER_TEMP/leannative-ci/$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: lake build
        run: |
          (cd "$APP_DIR" && lake env true)
          "$LEANNATIVE_CI/lake-build"
      - name: Prepare
        if: inputs.prepare != ''
        env:
          COMMAND: ${{ inputs.prepare }}
        run: bash -c "$COMMAND" 2>&1 | "$LEANNATIVE_CI/progress" "$CI_RESULTS/prepare.log" .
      - name: Pack what the other jobs need
        if: inputs.carry != ''
        env:
          CARRY: ${{ inputs.carry }}
        run: |
          # a tar keeps the paths (an artifact of one directory is stored relative to it)
          paths=()
          while IFS= read -r p; do [ -n "$p" ] && paths+=("$p"); done <<< "$CARRY"
          tar -cvf "$RUNNER_TEMP/leannative-carry.tar" "${paths[@]}"
      - name: Carry it
        if: inputs.carry != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leannative-carry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/leannative-carry.tar
          if-no-files-found: error
          retention-days: 1
      - name: Keep the Lean builds (this Mac)
        if: needs.runner.outputs.local == 'true'
        env:
          KEY: ${{ steps.key.outputs.key }}
        run: |
          set -euo pipefail
          root="${LEANNATIVE_CI_CACHE:-$HOME/Library/Caches/leannative-ci}/$GITHUB_REPOSITORY"
          mkdir -p "$root"
          if [ -d "$root/$KEY" ]; then echo "already kept: $KEY"; touch "$root/$KEY"; exit 0; fi
          tmp="$root/.partial-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          rm -rf "$tmp"
          for p in $LEAN_PACKAGES; do mkdir -p "$tmp/$p"; cp -cRp "$p/.lake" "$tmp/$p/.lake"; done
          if [ -d "$root/$KEY" ]; then rm -rf "$tmp"; else mv "$tmp" "$root/$KEY"; fi
          # the six newest builds stay
          # shellcheck disable=SC2012 # the names are cache keys
          ls -td "$root"/leannative-* | tail -n +7 | while IFS= read -r old; do rm -rf "$old"; done
          du -sh "$root/$KEY"
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/leannative-ci/build/
          if-no-files-found: warn
          retention-days: 14

  tests:
    if: inputs.tests != ''
    needs: [runner, build]
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore the build
        if: needs.runner.outputs.local != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ needs.build.outputs.paths }}
          key: ${{ needs.build.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore the build (this Mac)
        if: needs.runner.outputs.local == 'true'
        env:
          KEY: ${{ needs.build.outputs.key }}
        run: *restore-local
      - name: elan and the Lean toolchain
        run: *elan
      - name: What the build job prepared
        if: inputs.carry != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: leannative-carry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Unpack it
        if: inputs.carry != ''
        run: tar -xvf "$RUNNER_TEMP/leannative-carry.tar"
      - name: Tests
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          set -uo pipefail
          mkdir -p "$CI_RESULTS"
          i=0; failed=()
          while IFS= read -r line; do
            [ -n "${line// }" ] || continue
            i=$((i + 1)); dir=${line%% *}; cmd=${line#* }
            # the log's name: the command's first word that is not an assignment, in characters an artifact allows
            first=$cmd
            while [[ $first == *=* && $first == *" "* && ${first%% *} == *=* ]]; do first=${first#* }; done
            base=$(basename -- "${first%% *}")
            name="$i-${base//[^A-Za-z0-9._-]/_}"
            echo "▶ $cmd ($dir)"
            if ! (cd "$dir" && bash -c "$cmd") 2>&1 | "$LEANNATIVE_CI/progress" "$CI_RESULTS/$name.log" .; then
              echo "::error::$cmd ($dir) failed"; failed+=("$name")
            fi
          done <<< "$TESTS"
          [ ${#failed[@]} -eq 0 ] || { echo "failed: ${failed[*]}"; exit 1; }
          echo "$i passed"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/leannative-ci/tests/
          if-no-files-found: warn
          retention-days: 14

  extra:
    if: inputs.extra != ''
    needs: [runner, build]
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore the build
        if: needs.runner.outputs.local != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ needs.build.outputs.paths }}
          key: ${{ needs.build.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore the build (this Mac)
        if: needs.runner.outputs.local == 'true'
        env:
          KEY: ${{ needs.build.outputs.key }}
        run: *restore-local
      - name: elan and the Lean toolchain
        run: *elan
      - name: What the build job prepared
        if: inputs.carry != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: leannative-carry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Unpack it
        if: inputs.carry != ''
        run: tar -xvf "$RUNNER_TEMP/leannative-carry.tar"
      - name: The app's own job
        env:
          COMMAND: ${{ inputs.extra }}
        run: |
          set -o pipefail
          mkdir -p "$CI_RESULTS"
          bash -c "$COMMAND" 2>&1 | "$LEANNATIVE_CI/progress" "$CI_RESULTS/extra.log" .
      - name: Preserve its evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extra-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/leannative-ci/extra/
            !${{ runner.temp }}/leannative-ci/extra/**/private/
          if-no-files-found: warn
          retention-days: 14

  app:
    needs: [runner, build]
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore the build
        if: needs.runner.outputs.local != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ needs.build.outputs.paths }}
          key: ${{ needs.build.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore the build (this Mac)
        if: needs.runner.outputs.local == 'true'
        env:
          KEY: ${{ needs.build.outputs.key }}
        run: *restore-local
      - name: elan and the Lean toolchain
        run: *elan
      - name: What the build job prepared
        if: inputs.carry != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: leannative-carry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Unpack it
        if: inputs.carry != ''
        run: tar -xvf "$RUNNER_TEMP/leannative-carry.tar"
      - name: The simulator builds, Debug and Release
        env:
          RELEASE_CHECK: ${{ inputs.release-check }}
        run: |
          set -euo pipefail
          export DERIVED_DATA="$CI_RESULTS/DerivedData"
          P="$DERIVED_DATA/Build/Products"
          mkdir -p "$CI_RESULTS"
          for config in Debug Release; do
            BUILD_LOG="$CI_RESULTS/$config-iossim.log" "$LEANNATIVE_CI/build-ios" "$config" iossim
            "$LEANNATIVE_CI/check-no-swift" "$CI_RESULTS/$config-iossim.log" "$P/$config-iphonesimulator/$SCHEME.app"
          done
          if [ -n "$RELEASE_CHECK" ]; then
            $RELEASE_CHECK "$P/Release-iphonesimulator/$SCHEME.app" "$P/Debug-iphonesimulator/$SCHEME.app"
          fi
      - name: UI tests
        if: inputs.ui-tests
        env:
          UI_NAME: ${{ inputs.ui-name }}
          UI_DEVICE_TYPE: ${{ inputs.ui-device-type }}
          UI_BEFORE: ${{ inputs.ui-before }}
          UI_AFTER: ${{ inputs.ui-after }}
          UI_ARGS: ${{ inputs.ui-args }}
        run: |
          # shellcheck disable=SC2086 # UI_ARGS are words
          DERIVED_DATA="$CI_RESULTS/DerivedData" UI_OUT="$CI_RESULTS/$UI_NAME" "$LEANNATIVE_CI/ui-tests" $UI_ARGS
      - name: After the UI tests
        if: inputs.ui-tests && inputs.after-ui != ''
        env:
          COMMAND: ${{ inputs.after-ui }}
        run: bash -c "$COMMAND" 2>&1 | "$LEANNATIVE_CI/progress" "$CI_RESULTS/after-ui.log" .
      - name: The device build, Release (unsigned)
        run: |
          set -euo pipefail
          export DERIVED_DATA="$CI_RESULTS/DerivedData"
          BUILD_LOG="$CI_RESULTS/Release-ios.log" "$LEANNATIVE_CI/build-ios" Release ios
          "$LEANNATIVE_CI/check-no-swift" "$CI_RESULTS/Release-ios.log" "$DERIVED_DATA/Build/Products/Release-iphoneos/$SCHEME.app"
      - name: Publish
        if: success() && inputs.publish-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.publish-name }}
          path: ${{ inputs.publish-path }}
          if-no-files-found: error
          retention-days: ${{ inputs.publish-retention-days }}
          overwrite: true
      - name: Preserve app evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/leannative-ci/app/
            !${{ runner.temp }}/leannative-ci/app/DerivedData/
            !${{ runner.temp }}/leannative-ci/app/**/private/
          if-no-files-found: warn
          retention-days: 14
