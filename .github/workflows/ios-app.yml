name: LeanNative iOS app
# Builds and tests a LeanNative app (README.md, "Continuous integration for an app") in three jobs that start
# at once: `lean` builds the Lean and runs every `tests` command at the same time; `app` builds the iOS app
# for the simulator (Debug) and runs the UI tests; `release` (with release-builds) makes the Release builds,
# simulator and device, and checks them. Each builds the Lean itself, on top of the latest build cached from
# main (`lean` saves it there: a pull request restores main's and adds no entry of its own; the toolchain is
# not cached, elan installs it in half a minute), so nothing passes between them and a rerun of any works
# alone. A simulator a job needs is created once the iOS build it tests is done: a cold boot and the first
# launch after it are minutes of CPU on a hosted runner's three cores, so a build beside it slows by about as
# much as it would save (README.md). The scripts it runs are LeanNative's own, from the
# app's resolved LeanNative package (<app-dir>/.lake/packages/leannative/framework/native/ci), so they are the
# commit the app pins; `leannative` must name that commit, and both jobs fail if the app's lake-manifest.json
# pins another.
#
#   uses: LeanNative/leannative/.github/workflows/ios-app.yml@<commit>
#   with: { leannative: <commit>, lean-packages: …, app-dir: …, app-root: …, scheme: …, … }
#
# Commands given as inputs run with bash in the repository root, the app's Lean on the PATH, CI_RESULTS set
# to the job's evidence directory and LEANNATIVE_CI to the scripts' directory (also as ELMLEAN_CI, deprecated, until
# v0.3.0).
on:
  workflow_call:
    inputs:
      leannative:
        description: The LeanNative commit this workflow is called at; must equal the app's lake-manifest.json pin
        type: string
        required: false
      elmlean:
        description: Deprecated name of `leannative` (until v0.3.0); give one of the two
        type: string
        required: false
      runs-on:
        description: The macOS runner label for the jobs
        type: string
        default: macos-26
      app-runs-on:
        description: "Another label for `app` (a smaller runner, say: the UI tests drive one simulator); default `runs-on`"
        type: string
        default: ''
      timeout-minutes:
        description: Each job's limit
        type: number
        default: 60
      lean-packages:
        description: The app's Lake packages, space-separated, in build order; their .lake directories are cached
        type: string
        required: true
      build-targets:
        description: "Lines `<package> <targets…>`: more Lake targets to build (the test executables)"
        type: string
        default: ''
      app-dir:
        description: The Lake package of the app (it requires leannative)
        type: string
        required: true
      app-root:
        description: The root module that registers the app
        type: string
        required: true
      scheme:
        description: The Xcode scheme; the app is <scheme>.app
        type: string
        required: true
      ios-dir:
        description: The app's ios directory, where its project is generated (default <app-dir>/ios)
        type: string
        default: ''
      prepare:
        description: A command each job runs after the Lean build (data the app bundles, say)
        type: string
        default: ''
      tests:
        description: "Lines `<directory> <command>`: all run at once in `lean`, after the build (framework/native/ci/run-tests); any failure fails the job"
        type: string
        default: ''
      release-check:
        description: A command run as `<command> <Release .app> <Debug .app>` on the simulator builds
        type: string
        default: ''
      test-mode-env:
        description: >-
          KEY=VALUE lines that switch the app's test mode on: set, `app` checks that the Release simulator build
          ignores them and the Debug build does not (framework/native/ci/test-mode-check)
        type: string
        default: ''
      test-mode-marker:
        description: A path in the app's data container that only a launch in test mode writes
        type: string
        default: ''
      release-marker:
        description: A path in the app's data container an ordinary launch writes (optional)
        type: string
        default: ''
      ui-tests:
        description: Run the scheme's UI tests on a throwaway simulator
        type: boolean
        default: true
      ui-name:
        description: The UI tests' evidence directory and the name of their result bundle and recording
        type: string
        default: ui-tests
      ui-device-type:
        description: The iPhone model the UI tests run on (the runner's newest iOS runtime must have it)
        type: string
        default: iPhone 17 Pro
      ui-args:
        description: More `xcodebuild test` arguments
        type: string
        default: ''
      ui-before:
        description: The UI tests' UI_BEFORE hook (framework/native/ci/ui-tests)
        type: string
        default: ''
      ui-after:
        description: The UI tests' UI_AFTER hook
        type: string
        default: ''
      ui-journey:
        description: >-
          A Lake executable of the app's package holding its journeys (LeanNative.Journey), built and run as the
          UI tests' UI_JOURNEY: xcodebuild then runs only the test kit's driver. Journey names may follow it
          (`journeys counting typing`) to run only those
        type: string
        default: ''
      ui-journey-shards:
        description: >-
          A JSON array of strings, each the journey names one runner runs (`["counting typing", "settings"]`):
          `app` runs once for each, at the same time, and a `media` job joins their evidence into one
          journey-media (one video, the parts one after another) and runs after-ui and publish. Empty, one
          `app` runs every journey ui-journey names
        type: string
        default: ''
      wire-journey:
        description: >-
          The journeys executable (and journey names), run headless against the app itself
          (framework/native/ci/wire-journeys, LEANNATIVE_DRIVER=wire) as one more line of `lean`'s tests, with
          ui-before and ui-after as its hooks: evidence in wire-journeys/
        type: string
        default: ''
      journey-media:
        description: >-
          A directory for the UI journeys' media and provenance (framework/native/ci/journey-media), made once
          the UI tests have passed, before after-ui; publish-path can name it
        type: string
        default: ''
      journey-media-args:
        description: "journey-media's options: `--video`, `--journeys`, `--test-prefix`, `--field KEY=VALUE`"
        type: string
        default: ''
      release-builds:
        description: >-
          The `release` job: the Release simulator build (and release-check and the test-mode check, on it
          and a Debug one) and the unsigned Release device build. Off, there is no `release` job
        type: boolean
        default: true
      after-ui:
        description: A command run once the UI tests have passed (media from their evidence, say)
        type: string
        default: ''
      publish-name:
        description: An artifact uploaded from `app` when everything passed
        type: string
        default: ''
      publish-path:
        description: Its path
        type: string
        default: ''
      publish-retention-days:
        type: number
        default: 90
permissions:
  contents: read
env:
  LEAN_PACKAGES: ${{ inputs.lean-packages }}
  BUILD_TARGETS: ${{ inputs.build-targets }}
  APP_DIR: ${{ inputs.app-dir }}
  APP_ROOT: ${{ inputs.app-root }}
  SCHEME: ${{ inputs.scheme }}
  IOS_DIR: ${{ inputs.ios-dir }}
  LEANNATIVE_CI: ${{ github.workspace }}/${{ inputs.app-dir }}/.lake/packages/leannative/framework/native/ci
  ELMLEAN_CI: ${{ github.workspace }}/${{ inputs.app-dir }}/.lake/packages/leannative/framework/native/ci
jobs:
  lean:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: The app pins this LeanNative
        env:
          WANT: ${{ inputs.leannative || inputs.elmlean }}
        run: &pin |
          [ -n "$WANT" ] || { echo "::error::the workflow needs leannative: <commit>"; exit 1; }
          found=$(/usr/bin/python3 - "$APP_DIR/lake-manifest.json" <<'PY'
          import json, sys
          print(" ".join(p.get("rev", "") for p in json.load(open(sys.argv[1]))["packages"] if p.get("name") == "leannative"))
          PY
          )
          echo "lake-manifest.json: leannative $found; workflow: leannative $WANT"
          [ "$found" = "$WANT" ] || { echo "::error::$APP_DIR/lake-manifest.json pins LeanNative at '$found', but the workflow is called with leannative: $WANT"; exit 1; }
      - name: The cache key
        id: key
        env:
          RUNS_ON: ${{ inputs.runs-on }}
        # Each package's .lake, keyed by the toolchain and manifests (deps) and every .lean file (source). A
        # miss restores the newest entry with the same deps, else with any (a bumped pin keeps the rest of the
        # build), and Lake rebuilds what changed. Not ~/.elan: the toolchain is 700 MB of every entry zstd'd and
        # elan installs it in half a minute.
        run: &key |
          set -euo pipefail
          paths=()
          deps=()
          specs=()
          for p in $LEAN_PACKAGES; do
            paths+=("$p/.lake")
            deps+=("$p/lean-toolchain" "$p/lake-manifest.json")
            specs+=("$p/*.lean")
          done
          deps_hash=$(cat "${deps[@]}" 2>/dev/null | shasum -a 256 | cut -c1-20)
          src_hash=$(git ls-files -z -- "${specs[@]}" | xargs -0 shasum -a 256 | shasum -a 256 | cut -c1-20)
          {
            echo "key=leannative-$RUNS_ON-$deps_hash-$src_hash"
            echo 'restore-keys<<KEYS'; echo "leannative-$RUNS_ON-$deps_hash-"; echo "leannative-$RUNS_ON-"; echo KEYS
            echo 'paths<<PATHS'; printf '%s\n' "${paths[@]}"; echo PATHS
          } >> "$GITHUB_OUTPUT"
      - name: Restore the Lean builds (main's latest; saved after `lake build`, on main only)
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.key.outputs.paths }}
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.restore-keys }}
      - name: elan and the Lean toolchain
        run: &elan |
          set -euo pipefail
          if ! command -v elan >/dev/null && [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh \
              | sh -s -- -y --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          # a newer elan refuses to install a toolchain it already has
          for p in $LEAN_PACKAGES; do
            t=$(cat "$p/lean-toolchain")
            have=$("$HOME/.elan/bin/elan" toolchain list)
            awk '{print $1}' <<< "$have" | grep -qxF "$t" || "$HOME/.elan/bin/elan" toolchain install "$t"
          done
          echo "CI_RESULTS=$RUNNER_TEMP/leannative-ci/$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: lake build
        run: &build |
          (cd "$APP_DIR" && lake env true)
          "$LEANNATIVE_CI/lake-build"
      # a pull request's run restores main's build and adds no entry: each is the whole build, and the cache
      # holds 10 GB a repository
      - name: Save the Lean builds
        if: github.event_name != 'pull_request' && steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.key.outputs.paths }}
          key: ${{ steps.key.outputs.key }}
      - name: Prepare
        if: inputs.prepare != ''
        env:
          COMMAND: ${{ inputs.prepare }}
        run: &prepare bash -c "$COMMAND" 2>&1 | "$LEANNATIVE_CI/progress" "$CI_RESULTS/prepare.log" .
      - name: Tests, all at once
        if: inputs.tests != '' || inputs.wire-journey != ''
        env:
          TESTS: ${{ inputs.tests }}
          WIRE_JOURNEY: ${{ inputs.wire-journey }}
          UI_BEFORE: ${{ inputs.ui-before }}
          UI_AFTER: ${{ inputs.ui-after }}
        run: |
          set -euo pipefail
          # the headless journeys are one more line, so they run alongside the rest
          if [ -n "$WIRE_JOURNEY" ]; then
            TESTS+=$'\n'". \$LEANNATIVE_CI/wire-journeys $WIRE_JOURNEY"
          fi
          export TESTS
          "$LEANNATIVE_CI/run-tests"
      - name: Preserve the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lean-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/leannative-ci/lean/
            !${{ runner.temp }}/leannative-ci/lean/**/private/
          if-no-files-found: warn
          retention-days: 14

  app:
    name: "${{ matrix.shard && format('app: {0}', matrix.shard) || 'app' }}"
    runs-on: ${{ inputs.app-runs-on || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    strategy:
      # each part's evidence even when another fails
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.ui-journey-shards || '[""]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # a minute of downloads, done by the time the media step needs it (which waits for ffmpeg.done)
      - name: ffmpeg, installing while the app builds
        if: inputs.ui-tests && inputs.journey-media != '' && matrix.shard == ''
        run: &ffmpeg |
          if command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null; then echo 0 > "$RUNNER_TEMP/ffmpeg.done"; exit 0; fi
          # shellcheck disable=SC2016 # the inner bash expands them
          nohup bash -c 'HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg > "$RUNNER_TEMP/ffmpeg.log" 2>&1; echo $? > "$RUNNER_TEMP/ffmpeg.done"' \
            </dev/null >/dev/null 2>&1 &
      - name: The app pins this LeanNative
        env:
          WANT: ${{ inputs.leannative || inputs.elmlean }}
        run: *pin
      - name: The cache key
        id: key
        env:
          RUNS_ON: ${{ inputs.runs-on }}
        run: *key
      - name: Restore the Lean builds (main's latest; `lean` saves them)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.key.outputs.paths }}
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.restore-keys }}
      - name: elan and the Lean toolchain
        run: *elan
      - name: lake build
        run: *build
      - name: Prepare
        if: inputs.prepare != ''
        env:
          COMMAND: ${{ inputs.prepare }}
        run: *prepare
      - name: The simulator build, Debug
        run: |
          set -euo pipefail
          export DERIVED_DATA="$CI_RESULTS/DerivedData"
          mkdir -p "$CI_RESULTS"
          BUILD_LOG="$CI_RESULTS/Debug-iossim.log" "$LEANNATIVE_CI/build-ios" Debug iossim
          "$LEANNATIVE_CI/check-no-swift" "$CI_RESULTS/Debug-iossim.log" "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/$SCHEME.app"
      - name: UI tests
        if: inputs.ui-tests
        env:
          UI_NAME: ${{ inputs.ui-name }}
          UI_DEVICE_TYPE: ${{ inputs.ui-device-type }}
          UI_BEFORE: ${{ inputs.ui-before }}
          UI_AFTER: ${{ inputs.ui-after }}
          UI_ARGS: ${{ inputs.ui-args }}
          JOURNEY_EXE: ${{ inputs.ui-journey }}
          SHARD: ${{ matrix.shard }}
          # the Debug build has just prepared the sources and project
          UI_PREPARED: '1'
        run: |
          set -euo pipefail
          if [ -n "$JOURNEY_EXE" ]; then
            exe=${JOURNEY_EXE%% *}; names=${JOURNEY_EXE#"$exe"}
            # this runner's part of the journeys
            [ -z "$SHARD" ] || names=" $SHARD"
            (cd "$APP_DIR" && lake build "$exe")
            UI_JOURNEY="$(cd "$APP_DIR" && pwd)/.lake/build/bin/$exe$names"
            export UI_JOURNEY
          fi
          # shellcheck disable=SC2086 # UI_ARGS are words
          DERIVED_DATA="$CI_RESULTS/DerivedData" UI_OUT="$CI_RESULTS/$UI_NAME" "$LEANNATIVE_CI/ui-tests" $UI_ARGS
      - name: The journeys' media
        if: inputs.ui-tests && inputs.journey-media != '' && matrix.shard == ''
        env:
          MEDIA: ${{ inputs.journey-media }}
          MEDIA_ARGS: ${{ inputs.journey-media-args }}
          UI_NAME: ${{ inputs.ui-name }}
        run: &media |
          set -euo pipefail
          # the recording is well over 25 MiB: its browser copy needs ffmpeg, and media without it is a failure.
          # It has been installing since the job began; installed here when that failed.
          for ((i = 0; i < 1200; i++)); do [ -f "$RUNNER_TEMP/ffmpeg.done" ] && break; sleep 0.5; done
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            cat "$RUNNER_TEMP/ffmpeg.log" 2>/dev/null || true
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg >/dev/null
          fi
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            echo "::error::journey-media needs ffmpeg and ffprobe"; exit 1
          fi
          rm -rf "$MEDIA"
          # one run, or the parts the media job downloaded (PARTS: their UI-tests directories, in order)
          read -r -a runs <<< "${PARTS:-$CI_RESULTS/$UI_NAME}"
          # shellcheck disable=SC2086 # MEDIA_ARGS are words
          "$LEANNATIVE_CI/journey-media" "${runs[@]}" "$MEDIA" $MEDIA_ARGS
      - name: After the UI tests
        if: inputs.ui-tests && inputs.after-ui != '' && matrix.shard == ''
        env:
          COMMAND: ${{ inputs.after-ui }}
        run: &after-ui bash -c "$COMMAND" 2>&1 | "$LEANNATIVE_CI/progress" "$CI_RESULTS/after-ui.log" .
      - name: Publish
        if: success() && inputs.publish-name != '' && matrix.shard == ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.publish-name }}
          path: ${{ inputs.publish-path }}
          if-no-files-found: error
          retention-days: ${{ inputs.publish-retention-days }}
          overwrite: true
      - name: Preserve the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # a part's is app-<run>-<attempt>-part-<index>, which the media job downloads
          name: app-${{ github.run_id }}-${{ github.run_attempt }}${{ matrix.shard && format('-part-{0}', strategy.job-index) || '' }}
          path: |
            ${{ runner.temp }}/leannative-ci/app/
            !${{ runner.temp }}/leannative-ci/app/DerivedData/
            !${{ runner.temp }}/leannative-ci/app/**/private/
          if-no-files-found: warn
          retention-days: 14


  media:
    # the parts' media, after-ui and publish, once every part has passed
    if: inputs.ui-tests && inputs.ui-journey-shards != ''
    needs: app
    runs-on: ${{ inputs.app-runs-on || inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    env:
      # the pinned commit's scripts, checked out on their own: this job builds no Lean
      LEANNATIVE_CI: ${{ github.workspace }}/.leannative/framework/native/ci
      ELMLEAN_CI: ${{ github.workspace }}/.leannative/framework/native/ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: ffmpeg, installing while the parts download
        if: inputs.journey-media != ''
        run: *ffmpeg
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: LeanNative/leannative
          ref: ${{ inputs.leannative || inputs.elmlean }}
          path: .leannative
      - name: The parts' evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: app-${{ github.run_id }}-${{ github.run_attempt }}-part-*
          path: ${{ runner.temp }}/leannative-ci/media/parts
      - name: The parts, in order
        env:
          SHARDS: ${{ inputs.ui-journey-shards }}
          UI_NAME: ${{ inputs.ui-name }}
          PREFIX: ${{ runner.temp }}/leannative-ci/media/parts/app-${{ github.run_id }}-${{ github.run_attempt }}-part-
        run: |
          set -euo pipefail
          count=$(/usr/bin/python3 -c 'import json, os; print(len(json.loads(os.environ["SHARDS"])))')
          parts=()
          for ((i = 0; i < count; i++)); do
            [ -d "$PREFIX$i/$UI_NAME" ] || { echo "::error::part $i's evidence has no $UI_NAME directory"; exit 1; }
            parts+=("$PREFIX$i/$UI_NAME")
          done
          { echo "PARTS=${parts[*]}"; echo "CI_RESULTS=$RUNNER_TEMP/leannative-ci/media"; } >> "$GITHUB_ENV"
      - name: The journeys' media
        if: inputs.journey-media != ''
        env:
          MEDIA: ${{ inputs.journey-media }}
          MEDIA_ARGS: ${{ inputs.journey-media-args }}
          UI_NAME: ${{ inputs.ui-name }}
        run: *media
      - name: After the UI tests
        if: inputs.after-ui != ''
        env:
          COMMAND: ${{ inputs.after-ui }}
        run: *after-ui
      - name: Publish
        if: success() && inputs.publish-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.publish-name }}
          path: ${{ inputs.publish-path }}
          if-no-files-found: error
          retention-days: ${{ inputs.publish-retention-days }}
          overwrite: true

  release:
    if: inputs.release-builds
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: The app pins this LeanNative
        env:
          WANT: ${{ inputs.leannative || inputs.elmlean }}
        run: *pin
      - name: The cache key
        id: key
        env:
          RUNS_ON: ${{ inputs.runs-on }}
        run: *key
      - name: Restore the Lean builds (main's latest; `lean` saves them)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.key.outputs.paths }}
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.restore-keys }}
      - name: elan and the Lean toolchain
        run: *elan
      - name: lake build
        run: *build
      - name: Prepare
        if: inputs.prepare != ''
        env:
          COMMAND: ${{ inputs.prepare }}
        run: *prepare
      - name: The simulator builds, Release (and Debug, for the checks)
        env:
          RELEASE_CHECK: ${{ inputs.release-check }}
          TEST_MODE_ENV: ${{ inputs.test-mode-env }}
          TEST_MODE_MARKER: ${{ inputs.test-mode-marker }}
          RELEASE_MARKER: ${{ inputs.release-marker }}
          UI_DEVICE_TYPE: ${{ inputs.ui-device-type }}
          CONFIGS: ${{ (inputs.release-check != '' || inputs.test-mode-env != '') && 'Debug Release' || 'Release' }}
        run: |
          set -euo pipefail
          export DERIVED_DATA="$CI_RESULTS/DerivedData"
          P="$DERIVED_DATA/Build/Products"
          mkdir -p "$CI_RESULTS"
          for config in $CONFIGS; do
            BUILD_LOG="$CI_RESULTS/$config-iossim.log" "$LEANNATIVE_CI/build-ios" "$config" iossim
            "$LEANNATIVE_CI/check-no-swift" "$CI_RESULTS/$config-iossim.log" "$P/$config-iphonesimulator/$SCHEME.app"
          done
          if [ -n "$RELEASE_CHECK" ]; then
            $RELEASE_CHECK "$P/Release-iphonesimulator/$SCHEME.app" "$P/Debug-iphonesimulator/$SCHEME.app"
          fi
          if [ -n "$TEST_MODE_ENV" ]; then
            "$LEANNATIVE_CI/test-mode-check" "$P/Release-iphonesimulator/$SCHEME.app" "$P/Debug-iphonesimulator/$SCHEME.app"
          fi
      - name: The device build, Release (unsigned)
        run: |
          set -euo pipefail
          export DERIVED_DATA="$CI_RESULTS/DerivedData"
          BUILD_LOG="$CI_RESULTS/Release-ios.log" "$LEANNATIVE_CI/build-ios" Release ios
          "$LEANNATIVE_CI/check-no-swift" "$CI_RESULTS/Release-ios.log" "$DERIVED_DATA/Build/Products/Release-iphoneos/$SCHEME.app"
      - name: Preserve the evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/leannative-ci/release/
            !${{ runner.temp }}/leannative-ci/release/DerivedData/
            !${{ runner.temp }}/leannative-ci/release/**/private/
          if-no-files-found: warn
          retention-days: 14
