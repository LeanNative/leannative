name: LeanNative iOS app
# Builds and tests an ElmLean app (README.md, "Continuous integration for an app"). `build` makes every Lean
# target once and saves it in the Actions cache; `tests`, `extra` and `app` restore that build read-only and
# run in parallel; they fail if the build is not in the cache rather than build again. The scripts it runs are
# ElmLean's own, from the app's resolved ElmLean package
# (<app-dir>/.lake/packages/elmlean/framework/native/ci), so they are the commit the app pins; `elmlean` must
# name that commit, and the build fails if the app's lake-manifest.json pins another.
#
#   uses: LeanNative/leannative/.github/workflows/ios-app.yml@<commit>
#   with: { elmlean: <commit>, lean-packages: …, app-dir: …, app-root: …, scheme: …, … }
#
# Commands given as inputs run with bash in the repository root, the app's Lean on the PATH, CI_RESULTS set
# to the job's evidence directory and ELMLEAN_CI to the scripts' directory.
on:
  workflow_call:
    inputs:
      elmlean:
        description: The ElmLean commit this workflow is called at; must equal the app's lake-manifest.json pin
        type: string
        required: true
      runs-on:
        description: The macOS runner label for every job
        type: string
        default: macos-26
      timeout-minutes:
        description: Each job's limit
        type: number
        default: 60
      lean-packages:
        description: The app's Lake packages, space-separated, in build order; their .lake directories are cached
        type: string
        required: true
      build-targets:
        description: "Lines `<package> <targets…>`: more Lake targets to build (the test executables)"
        type: string
        default: ''
      app-dir:
        description: The Lake package of the app (it requires elmlean)
        type: string
        required: true
      app-root:
        description: The root module that registers the app
        type: string
        required: true
      scheme:
        description: The Xcode scheme; the app is <scheme>.app
        type: string
        required: true
      ios-dir:
        description: The app's ios directory, where its project is generated (default <app-dir>/ios)
        type: string
        default: ''
      prepare:
        description: A command run in `build` after the Lean build (data the app bundles, say)
        type: string
        default: ''
      carry:
        description: Paths the `prepare` command makes that the other jobs need, one per line
        type: string
        default: ''
      tests:
        description: "Lines `<directory> <command>`: each runs in `tests`, streamed; every line runs, and any failure fails the job"
        type: string
        default: ''
      extra:
        description: A command for a job of its own, beside `tests` and `app`
        type: string
        default: ''
      release-check:
        description: A command run as `<command> <Release .app> <Debug .app>` on the simulator builds
        type: string
        default: ''
      ui-tests:
        description: Run the scheme's UI tests on a throwaway simulator
        type: boolean
        default: true
      ui-name:
        description: The UI tests' evidence directory and the name of their result bundle and recording
        type: string
        default: ui-tests
      ui-device-type:
        description: The iPhone model the UI tests run on (the runner's newest iOS runtime must have it)
        type: string
        default: iPhone 17 Pro
      ui-args:
        description: More `xcodebuild test` arguments
        type: string
        default: ''
      ui-before:
        description: The UI tests' UI_BEFORE hook (framework/native/ci/ui-tests)
        type: string
        default: ''
      ui-after:
        description: The UI tests' UI_AFTER hook
        type: string
        default: ''
      after-ui:
        description: A command run once the UI tests have passed (media from their evidence, say)
        type: string
        default: ''
      publish-name:
        description: An artifact uploaded from `app` when everything passed
        type: string
        default: ''
      publish-path:
        description: Its path
        type: string
        default: ''
      publish-retention-days:
        type: number
        default: 90
permissions:
  contents: read
env:
  LEAN_PACKAGES: ${{ inputs.lean-packages }}
  BUILD_TARGETS: ${{ inputs.build-targets }}
  APP_DIR: ${{ inputs.app-dir }}
  APP_ROOT: ${{ inputs.app-root }}
  SCHEME: ${{ inputs.scheme }}
  IOS_DIR: ${{ inputs.ios-dir }}
  ELMLEAN_CI: ${{ github.workspace }}/${{ inputs.app-dir }}/.lake/packages/elmlean/framework/native/ci
jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      key: ${{ steps.key.outputs.key }}
      paths: ${{ steps.key.outputs.paths }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: The app pins this ElmLean
        env:
          WANT: ${{ inputs.elmlean }}
        run: |
          found=$(/usr/bin/python3 - "$APP_DIR/lake-manifest.json" <<'PY'
          import json, sys
          print(" ".join(p.get("rev", "") for p in json.load(open(sys.argv[1]))["packages"] if p.get("name") == "elmlean"))
          PY
          )
          echo "lake-manifest.json: elmlean $found; workflow: elmlean $WANT"
          [ "$found" = "$WANT" ] || { echo "::error::$APP_DIR/lake-manifest.json pins ElmLean at '$found', but the workflow is called with elmlean: $WANT"; exit 1; }
      - name: The cache key
        id: key
        env:
          RUNS_ON: ${{ inputs.runs-on }}
        run: |
          set -euo pipefail
          paths="$HOME/.elan"
          deps=()
          specs=()
          for p in $LEAN_PACKAGES; do
            paths+=$'\n'"$p/.lake"
            deps+=("$p/lean-toolchain" "$p/lake-manifest.json")
            specs+=("$p/*.lean")
          done
          deps_hash=$(cat "${deps[@]}" 2>/dev/null | shasum -a 256 | cut -c1-20)
          src_hash=$(git ls-files -z -- "${specs[@]}" | xargs -0 shasum -a 256 | shasum -a 256 | cut -c1-20)
          {
            echo "key=elmlean-$RUNS_ON-$deps_hash-$src_hash"
            echo "prefix=elmlean-$RUNS_ON-$deps_hash-"
            echo 'paths<<PATHS'; echo "$paths"; echo PATHS
          } >> "$GITHUB_OUTPUT"
      - name: Restore the Lean toolchain and builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.key.outputs.paths }}
          key: ${{ steps.key.outputs.key }}
          restore-keys: ${{ steps.key.outputs.prefix }}
      - name: elan and the Lean toolchain
        run: &elan |
          set -euo pipefail
          if ! command -v elan >/dev/null && [ ! -x "$HOME/.elan/bin/elan" ]; then
            curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh \
              | sh -s -- -y --default-toolchain none --no-modify-path
          fi
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          for p in $LEAN_PACKAGES; do "$HOME/.elan/bin/elan" toolchain install "$(cat "$p/lean-toolchain")"; done
          echo "CI_RESULTS=$RUNNER_TEMP/elmlean-ci/$GITHUB_JOB" >> "$GITHUB_ENV"
      - name: lake build
        run: |
          (cd "$APP_DIR" && lake env true)
          "$ELMLEAN_CI/lake-build"
      - name: Prepare
        if: inputs.prepare != ''
        env:
          COMMAND: ${{ inputs.prepare }}
        run: bash -c "$COMMAND" 2>&1 | "$ELMLEAN_CI/progress" "$CI_RESULTS/prepare.log" .
      - name: Pack what the other jobs need
        if: inputs.carry != ''
        env:
          CARRY: ${{ inputs.carry }}
        run: |
          # a tar keeps the paths (an artifact of one directory is stored relative to it)
          paths=()
          while IFS= read -r p; do [ -n "$p" ] && paths+=("$p"); done <<< "$CARRY"
          tar -cvf "$RUNNER_TEMP/elmlean-carry.tar" "${paths[@]}"
      - name: Carry it
        if: inputs.carry != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: elmlean-carry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/elmlean-carry.tar
          if-no-files-found: error
          retention-days: 1
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/elmlean-ci/build/
          if-no-files-found: warn
          retention-days: 14

  tests:
    if: inputs.tests != ''
    needs: build
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ needs.build.outputs.paths }}
          key: ${{ needs.build.outputs.key }}
          fail-on-cache-miss: true
      - name: elan and the Lean toolchain
        run: *elan
      - name: What the build job prepared
        if: inputs.carry != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: elmlean-carry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Unpack it
        if: inputs.carry != ''
        run: tar -xvf "$RUNNER_TEMP/elmlean-carry.tar"
      - name: Tests
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          set -uo pipefail
          mkdir -p "$CI_RESULTS"
          i=0; failed=()
          while IFS= read -r line; do
            [ -n "${line// }" ] || continue
            i=$((i + 1)); dir=${line%% *}; cmd=${line#* }
            # the log's name: the command's first word that is not an assignment, in characters an artifact allows
            first=$cmd
            while [[ $first == *=* && $first == *" "* && ${first%% *} == *=* ]]; do first=${first#* }; done
            base=$(basename -- "${first%% *}")
            name="$i-${base//[^A-Za-z0-9._-]/_}"
            echo "▶ $cmd ($dir)"
            if ! (cd "$dir" && bash -c "$cmd") 2>&1 | "$ELMLEAN_CI/progress" "$CI_RESULTS/$name.log" .; then
              echo "::error::$cmd ($dir) failed"; failed+=("$name")
            fi
          done <<< "$TESTS"
          [ ${#failed[@]} -eq 0 ] || { echo "failed: ${failed[*]}"; exit 1; }
          echo "$i passed"
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/elmlean-ci/tests/
          if-no-files-found: warn
          retention-days: 14

  extra:
    if: inputs.extra != ''
    needs: build
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ needs.build.outputs.paths }}
          key: ${{ needs.build.outputs.key }}
          fail-on-cache-miss: true
      - name: elan and the Lean toolchain
        run: *elan
      - name: What the build job prepared
        if: inputs.carry != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: elmlean-carry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Unpack it
        if: inputs.carry != ''
        run: tar -xvf "$RUNNER_TEMP/elmlean-carry.tar"
      - name: The app's own job
        env:
          COMMAND: ${{ inputs.extra }}
        run: |
          set -o pipefail
          mkdir -p "$CI_RESULTS"
          bash -c "$COMMAND" 2>&1 | "$ELMLEAN_CI/progress" "$CI_RESULTS/extra.log" .
      - name: Preserve its evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extra-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/elmlean-ci/extra/
            !${{ runner.temp }}/elmlean-ci/extra/**/private/
          if-no-files-found: warn
          retention-days: 14

  app:
    needs: build
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore the build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ needs.build.outputs.paths }}
          key: ${{ needs.build.outputs.key }}
          fail-on-cache-miss: true
      - name: elan and the Lean toolchain
        run: *elan
      - name: What the build job prepared
        if: inputs.carry != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: elmlean-carry-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}
      - name: Unpack it
        if: inputs.carry != ''
        run: tar -xvf "$RUNNER_TEMP/elmlean-carry.tar"
      - name: The simulator builds, Debug and Release
        env:
          RELEASE_CHECK: ${{ inputs.release-check }}
        run: |
          set -euo pipefail
          export DERIVED_DATA="$CI_RESULTS/DerivedData"
          P="$DERIVED_DATA/Build/Products"
          mkdir -p "$CI_RESULTS"
          for config in Debug Release; do
            BUILD_LOG="$CI_RESULTS/$config-iossim.log" "$ELMLEAN_CI/build-ios" "$config" iossim
            "$ELMLEAN_CI/check-no-swift" "$CI_RESULTS/$config-iossim.log" "$P/$config-iphonesimulator/$SCHEME.app"
          done
          if [ -n "$RELEASE_CHECK" ]; then
            $RELEASE_CHECK "$P/Release-iphonesimulator/$SCHEME.app" "$P/Debug-iphonesimulator/$SCHEME.app"
          fi
      - name: UI tests
        if: inputs.ui-tests
        env:
          UI_NAME: ${{ inputs.ui-name }}
          UI_DEVICE_TYPE: ${{ inputs.ui-device-type }}
          UI_BEFORE: ${{ inputs.ui-before }}
          UI_AFTER: ${{ inputs.ui-after }}
          UI_ARGS: ${{ inputs.ui-args }}
        run: |
          # shellcheck disable=SC2086 # UI_ARGS are words
          DERIVED_DATA="$CI_RESULTS/DerivedData" UI_OUT="$CI_RESULTS/$UI_NAME" "$ELMLEAN_CI/ui-tests" $UI_ARGS
      - name: After the UI tests
        if: inputs.ui-tests && inputs.after-ui != ''
        env:
          COMMAND: ${{ inputs.after-ui }}
        run: bash -c "$COMMAND" 2>&1 | "$ELMLEAN_CI/progress" "$CI_RESULTS/after-ui.log" .
      - name: The device build, Release (unsigned)
        run: |
          set -euo pipefail
          export DERIVED_DATA="$CI_RESULTS/DerivedData"
          BUILD_LOG="$CI_RESULTS/Release-ios.log" "$ELMLEAN_CI/build-ios" Release ios
          "$ELMLEAN_CI/check-no-swift" "$CI_RESULTS/Release-ios.log" "$DERIVED_DATA/Build/Products/Release-iphoneos/$SCHEME.app"
      - name: Publish
        if: success() && inputs.publish-name != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.publish-name }}
          path: ${{ inputs.publish-path }}
          if-no-files-found: error
          retention-days: ${{ inputs.publish-retention-days }}
          overwrite: true
      - name: Preserve app evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/elmlean-ci/app/
            !${{ runner.temp }}/elmlean-ci/app/DerivedData/
            !${{ runner.temp }}/elmlean-ci/app/**/private/
          if-no-files-found: warn
          retention-days: 14
